<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Advice generator app</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->

</head>
<body>
  <main>
    <div class="card">
      <p class="advice-label"> Advice #<span id="advice-id">117</span> </p>
      <p id="advice-text">It is easy to sit up and take notice, what's difficult is getting up and taking action.</p>

      <div class="divider">
        <picture>
          <source media="(min-width: 768px)" srcset="./images/pattern-divider-desktop.svg">
          <img src="./images/pattern-divider-mobile.svg" alt="">
        </picture>
      </div>
      
      <button id="advice-btn" aria-label="Get new advice">
        <img src="./images/icon-dice.svg" alt="">
      </button>
    </div>
  </main>  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Ekwem John Ikenna</a>.
  </footer>
  <script src="script.js"></script>
</body>
</html>
